---
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: j178/prek-action@v1

  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o ./dist/

      - name: Test
        uses: robherley/go-test-action@v0
        with:
          args: -v

  acceptance-test:
    name: "Acceptance tests (StarRocks ${{ matrix.starrocks-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starrocks-version:
          - "3.5.20"
          - "4.0.13"
          - "4.1.1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start StarRocks ${{ matrix.starrocks-version }}
        env:
          STARROCKS_VERSION: ${{ matrix.starrocks-version }}
        run: docker compose up -d

      - name: Wait for StarRocks to be healthy
        run: |
          echo "Waiting for StarRocks to become healthy..."
          for i in $(seq 1 36); do
            status=$(docker inspect --format='{{.State.Health.Status}}' starrocks 2>/dev/null || echo "missing")
            echo "  attempt $i/36 — status: $status"
            if [ "$status" = "healthy" ]; then
              echo "StarRocks is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "StarRocks did not become healthy in time."
          docker compose logs starrocks
          exit 1

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          STARROCKS_HOST: "127.0.0.1"
          STARROCKS_PORT: "9030"
          STARROCKS_USERNAME: "root"
          STARROCKS_PASSWORD: ""
        uses: robherley/go-test-action@v0
        with:
          args: -v -run TestAcc_ -timeout 20m ./internal/provider/

      - name: Stop StarRocks
        if: always()
        run: docker compose down -v
